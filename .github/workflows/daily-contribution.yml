name: Daily contribution

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make daily commit
        run: |
          day=$(date -u +%u)
          if [ "$day" -gt 5 ]; then
            echo "Weekend — skipping"
            exit 0
          fi
          stamp=$(date -u '+%Y-%m-%d')
          if grep -q "$stamp" activity-log.txt; then
            echo "Already committed today — skipping"
            exit 0
          fi
          echo "$stamp $(date -u '+%H:%M:%S') UTC" >> activity-log.txt
          git config user.name "PRADIPGOSAIN"
          git config user.email "pradipking1234@gmail.com"
          git add activity-log.txt
          git commit -m "daily activity: $stamp"
          git push